<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta http-equiv="Content-Security-Policy"
        content="default-src * data: gap: 'unsafe-eval' 'unsafe-inline'; style-src * 'unsafe-inline'; font-src * data:; script-src * 'unsafe-inline' 'unsafe-eval'; connect-src * ws: wss:; media-src *;">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>WebRTC</title>

    <style>
        :root {
            --wa-teal: #00a884;
            --wa-dark-bg: #111b21;
            --wa-card-bg: #202c33;
            --wa-outgoing: #005c4b;
            --wa-incoming: #202c33;
            --wa-text: #e9edef;
            --wa-subtext: #8696a0;
            --wa-blue-tick: #53bdeb;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #0c1317;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--wa-text);
            overflow: hidden;
        }

        /* MOBİL CONTAINER VE SAFE AREA (ÇENTİK & DURUM BARI PAYI) */
        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            /* Dynamic Viewport Height (Mobil Adres Çubuğu Uyumlu) */
            margin: 0 auto;
            background: var(--wa-dark-bg);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            padding-top: env(safe-area-inset-top);
            /* iOS ve Android çentik payı */
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* GİRİŞ EKRANI */
        #loginScreen {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .glass-card {
            background: var(--wa-card-bg);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            width: 90%;
            text-align: center;
        }

        .glass-input {
            background: #111b21 !important;
            border: 1px solid #2a3942 !important;
            color: #fff !important;
            border-radius: 12px;
            padding: 12px 16px;
        }

        .btn-wa {
            background: var(--wa-teal);
            color: #111b21;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            padding: 12px;
            width: 100%;
        }

        /* TEPEDEKİ HEADER VE SEKMELERİN GÖRÜNÜR OLMASINI SAĞLAYAN DÜZENLEME */
        #dialScreen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .wa-header {
            background: var(--wa-card-bg);
            padding: 14px 16px 0 16px;
            flex-shrink: 0;
            /* Header'ın sıkışmasını/kaybolmasını engeller */
            z-index: 10;
        }

        .wa-nav-tabs {
            display: flex;
            border-bottom: 2px solid #222d34;
            margin-top: 12px;
        }

        .wa-tab-item {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            color: var(--wa-subtext);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            position: relative;
        }

        .wa-tab-item.active {
            color: var(--wa-teal);
            border-bottom: 3px solid var(--wa-teal);
        }

        .badge-unread {
            background: var(--wa-teal);
            color: #111b21;
            font-size: 0.72rem;
            font-weight: bold;
            border-radius: 50%;
            padding: 2px 7px;
            margin-left: 4px;
        }

        /* LİSTE ALANI (SADECE BURASI KAYDIRILABİLİR) */
        .tab-content-container {
            flex: 1;
            overflow-y: auto;
            width: 100%;
        }

        .chat-list-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #222d34;
            cursor: pointer;
            transition: background 0.2s;
        }

        .chat-list-item:active {
            background: #2a3942;
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #6a7f8a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: #fff;
            margin-right: 14px;
            position: relative;
            flex-shrink: 0;
        }

        .online-indicator {
            width: 12px;
            height: 12px;
            background: #00a884;
            border-radius: 50%;
            position: absolute;
            bottom: 2px;
            right: 2px;
            border: 2px solid var(--wa-dark-bg);
        }

        /* SOHBET PENCERESİ EKRANI */
        .chat-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b141a;
            z-index: 50;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: var(--wa-card-bg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .chat-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-image: radial-gradient(#ffffff0a 1px, transparent 1px);
            background-size: 16px 16px;
        }

        .msg-bubble {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.92rem;
            position: relative;
            word-wrap: break-word;
        }

        .msg-outgoing {
            align-self: flex-end;
            background: var(--wa-outgoing);
            color: #e9edef;
            border-top-right-radius: 0;
        }

        .msg-incoming {
            align-self: flex-start;
            background: var(--wa-incoming);
            color: #e9edef;
            border-top-left-radius: 0;
        }

        .msg-meta {
            font-size: 0.68rem;
            color: var(--wa-subtext);
            float: right;
            margin-left: 10px;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .tick-blue {
            color: var(--wa-blue-tick);
        }

        .chat-footer {
            background: var(--wa-card-bg);
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        /* GÖRÜŞME VE KONTROL BARI */
        .call-screen-container {
            width: 100%;
            height: 100%;
            background: #121620;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 80px 20px 60px 20px;
            z-index: 100;
        }

        .main-video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        .main-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .pip-container {
            position: absolute;
            top: 70px;
            right: 20px;
            width: 100px;
            height: 150px;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid var(--wa-teal);
            z-index: 10;
            cursor: pointer;
        }

        .pip-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .bottom-control-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(32, 44, 51, 0.95);
            border-radius: 40px;
            padding: 10px 24px;
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 20;
            width: 85%;
            justify-content: space-around;
        }

        .btn-call-action {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            background: rgba(255, 255, 255, 0.12);
        }

        .btn-call-action.danger {
            background: #ff0844;
        }

        .btn-call-action.success {
            background: #00a884;
        }
    </style>
</head>

<body>

    <div class="app-container">

        <!-- EKRAN 1: GİRİŞ -->
        <div id="loginScreen" class="w-100 h-100 d-flex justify-content-center align-items-center">
            <div class="glass-card">
                <i class="fa-brands fa-whatsapp text-success fa-4x mb-3"></i>
                <h4 class="fw-bold mb-1">WhatsApp WebRTC</h4>
                <p class="text-muted small mb-4">Giriş Yaparak Sohbet Et ve Ara</p>
                <input type="text" id="usernameInput" class="form-control glass-input mb-3 text-center"
                    placeholder="Kullanıcı Adınız" autocomplete="off">
                <button id="loginBtn" class="btn btn-wa">Giriş Yap</button>
            </div>
        </div>

        <!-- EKRAN 2: LOBİ & TABS (SOHBETLER, ARAMALAR, KİŞİLER) -->
        <div id="dialScreen" class="w-100 h-100 d-none flex-column">
            <div class="wa-header">
                <div class="d-flex justify-content-between align-items-center">
                    <h5 class="fw-bold m-0 text-success"><i class="fa-brands fa-whatsapp me-2"></i>WhatsApp</h5>
                    <div class="d-flex gap-3 align-items-center">
                        <span class="small fw-bold" id="myUsernameDisplay">Ben</span>
                        <i id="logoutBtn" class="fa-solid fa-power-off text-danger cursor-pointer fs-5"></i>
                    </div>
                </div>
                <div class="wa-nav-tabs">
                    <div class="wa-tab-item active" id="tab-chats">Sohbetler</div>
                    <div class="wa-tab-item" id="tab-calls">Aramalar</div>
                    <div class="wa-tab-item" id="tab-contacts">Kişiler (<span id="onlineCountBadge">0</span>)</div>
                </div>
            </div>

            <!-- TABS İÇERİKLERİ -->
            <div class="flex-grow-1 overflow-y-auto">
                <div id="view-chats" class="w-100">
                    <div id="recentChatsList"></div>
                </div>
                <div id="view-calls" class="w-100 d-none">
                    <div id="historyList"></div>
                </div>
                <div id="view-contacts" class="w-100 d-none">
                    <div id="onlineUsersList"></div>
                </div>
            </div>
        </div>

        <!-- EKRAN 3: DETAYLI CHAT EKRANI -->
        <div id="chatScreen" class="chat-screen d-none">
            <div class="chat-header">
                <div class="d-flex align-items-center gap-2">
                    <i id="backFromChatBtn" class="fa-solid fa-arrow-left fs-5 text-white cursor-pointer me-1"></i>
                    <div class="user-avatar" style="width:38px; height:38px; font-size:1.1rem;" id="chatHeaderAvatar">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div>
                        <div class="fw-bold text-white small" id="chatHeaderTitle">Kullanıcı</div>
                        <div style="font-size: 0.72rem;" class="text-success" id="chatHeaderStatus">Çevrimiçi</div>
                    </div>
                </div>
                <div class="d-flex gap-3 text-white fs-5 align-items-center">
                    <i id="headerCallVideoBtn" class="fa-solid fa-video cursor-pointer text-success"></i>
                    <i id="headerCallAudioBtn" class="fa-solid fa-phone cursor-pointer text-success"></i>
                </div>
            </div>

            <div class="chat-body" id="chatMessageArea">
                <!-- REVERSE FLATLIST MANTIĞI İLE MESAJLAR YÜKLENİR -->
            </div>

            <div class="chat-footer">
                <input type="text" id="chatInput" class="form-control glass-input" placeholder="Mesaj yazın..."
                    autocomplete="off">
                <button id="sendMsgBtn" class="btn btn-wa rounded-circle p-0"
                    style="width:42px; height:42px; flex-shrink:0;">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <!-- EKRAN 4: GELEN ARAMA MODAL -->
        <div id="incomingCallModal" class="call-screen-container position-absolute top-0 start-0 d-none">
            <div class="text-center mt-5">
                <div class="user-avatar mx-auto mb-3" style="width:120px; height:120px; font-size:3rem;">
                    <i class="fa-solid fa-user"></i>
                </div>
                <h3 class="fw-bold text-white mb-2" id="callerNameDisplay">Bilinmeyen</h3>
                <p class="text-success fs-5" id="callTypeDisplay">Görüntülü Arama...</p>
            </div>

            <div class="d-flex gap-5 mb-5">
                <button id="rejectBtn" class="btn-call-action danger" style="width: 65px; height: 65px;">
                    <i class="fa-solid fa-phone-slash fa-lg"></i>
                </button>
                <button id="acceptBtn" class="btn-call-action success" style="width: 65px; height: 65px;">
                    <i class="fa-solid fa-phone fa-lg"></i>
                </button>
            </div>
        </div>

        <!-- EKRAN 4.5: ARAYAN İÇİN "ARANIYOR..." MODAL (YENİ EKLENDİ) -->
        <div id="outgoingCallModal" class="call-screen-container position-absolute top-0 start-0 d-none">
            <div class="text-center mt-5">
                <div class="user-avatar mx-auto mb-3" style="width:120px; height:120px; font-size:3rem;">
                    <i class="fa-solid fa-user"></i>
                </div>
                <h3 class="fw-bold text-white mb-2" id="outgoingTargetNameDisplay">Bilinmeyen</h3>
                <p class="text-success fs-5" id="outgoingCallTypeDisplay">Aranıyor...</p>
            </div>

            <div class="d-flex justify-content-center mb-5">
                <button id="cancelCallBtn" class="btn-call-action danger" style="width: 65px; height: 65px;"
                    title="Aramayı İptal Et">
                    <i class="fa-solid fa-phone-slash fa-lg"></i>
                </button>
            </div>
        </div>

        <!-- EKRAN 5: WEBRTC GÖRÜŞME EKRANI -->
        <div id="videoScreen" class="w-100 h-100 d-none position-relative">
            <div class="position-absolute top-0 start-0 m-3 z-3 bg-dark px-3 py-1 rounded-pill small border border-success"
                id="callTimerBadge">00:00</div>

            <div class="main-video-container" id="mainVideoWrapper">
                <video id="remoteVideo" autoplay playsinline class="main-video"></video>
                <div id="remoteCameraOffOverlay"
                    class="position-absolute top-0 start-0 w-100 h-100 bg-dark d-none flex-column justify-content-center align-items-center z-2">
                    <div class="user-avatar mb-3" style="width:100px; height:100px; font-size:2.5rem;"><i
                            class="fa-solid fa-user"></i></div>
                    <h6 class="text-white" id="remoteCamOffText">Kamera Kapalı</h6>
                </div>
            </div>

            <div class="pip-container" id="pipVideoWrapper">
                <video id="localVideo" autoplay playsinline muted class="pip-video"></video>
                <div id="localCameraOffOverlay"
                    class="position-absolute top-0 start-0 w-100 h-100 bg-dark d-none flex-column justify-content-center align-items-center">
                    <i class="fa-solid fa-user-slash text-light opacity-50"></i>
                </div>
            </div>

            <div class="bottom-control-bar">
                <button id="switchCamBtn" class="btn-call-action"><i class="fa-solid fa-camera-rotate"></i></button>
                <button id="toggleCamBtn" class="btn-call-action"><i class="fa-solid fa-video-slash"></i></button>
                <button id="toggleMicBtn" class="btn-call-action"><i class="fa-solid fa-microphone"></i></button>
                <button id="hangUpBtn" class="btn-call-action danger"><i class="fa-solid fa-phone-slash"></i></button>
            </div>
        </div>

    </div>

    <script type="text/javascript" src="cordova.js"></script>
    <script type="text/javascript" src="js/index.js"></script>
</body>

</html>
